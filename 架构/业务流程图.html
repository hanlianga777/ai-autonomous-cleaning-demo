<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 自主清洁与移动巡检业务闭环</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; }
    main { max-width: 1280px; margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
    .sans { font-family: Geist, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "Geist Mono", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", monospace; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="business-flow-title business-flow-desc">
      <title id="business-flow-title">AI 自主清洁与移动巡检业务闭环</title>
      <desc id="business-flow-desc">固定摄像头和机器人移动视觉发现事件，经 AI 研判、空间定位和确定性调度后，由机器人或人工处置并完成验收与运营优化。</desc>
      <defs>
        <pattern id="business-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="rgba(45,49,66,0.08)"/></pattern>
        <marker id="business-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="business-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>
      <rect width="1280" height="720" fill="url(#business-flow-dots)" opacity="0.52"/>
      <text x="48" y="48" class="mono" font-size="12" font-weight="600" letter-spacing="2" fill="#4f5d75">面试架构 · 业务流程</text>
      <text x="48" y="88" class="sans" font-size="32" font-weight="600" fill="#2d3142">AI 自主清洁与移动巡检业务闭环</text>
      <text x="48" y="116" class="sans" font-size="16" fill="#4f5d75">先证据、后调度；机器人执行与人工兜底共享同一可审计闭环</text>

      <rect x="48" y="152" width="1184" height="416" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.16)"/>
      <line x1="200" y1="152" x2="200" y2="568" stroke="rgba(45,49,66,0.20)"/>
      <line x1="48" y1="248" x2="1232" y2="248" stroke="rgba(45,49,66,0.12)"/>
      <line x1="48" y1="344" x2="1232" y2="344" stroke="rgba(45,49,66,0.12)"/>
      <line x1="48" y1="440" x2="1232" y2="440" stroke="rgba(45,49,66,0.12)"/>
      <line x1="48" y1="536" x2="1232" y2="536" stroke="rgba(45,49,66,0.12)"/>

      <g class="mono" font-size="12" font-weight="600" letter-spacing="1" fill="#4f5d75" text-anchor="middle">
        <text x="280" y="176">01 发现</text><text x="464" y="176">02 研判</text><text x="648" y="176">03 定位</text>
        <text x="832" y="176" fill="#eb6c36">04 分派</text><text x="1016" y="176">05 处置</text><text x="1184" y="176">06 验收</text>
      </g>
      <g class="sans" font-size="16" font-weight="600" fill="#4f5d75" text-anchor="middle">
        <text x="124" y="208">固定感知</text><text x="124" y="304">移动感知</text>
        <text x="124" y="400">AI 与调度</text><text x="124" y="496">执行与运营</text>
      </g>

      <!-- connectors are drawn before nodes -->
      <path d="M 360,216 H 424 Q 432,216 432,224 V 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#business-flow-arrow)"/>
      <path d="M 360,312 H 448 Q 456,312 456,320 V 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#business-flow-arrow)"/>
      <line x1="544" y1="412" x2="568" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#business-flow-arrow)"/>
      <line x1="728" y1="412" x2="752" y2="412" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#business-flow-arrow-accent)"/>
      <path d="M 912,412 H 936 Q 944,412 944,420 V 476" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#business-flow-arrow-accent)"/>
      <line x1="1072" y1="508" x2="1104" y2="508" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#business-flow-arrow)"/>

      <!-- nodes -->
      <g class="sans">
        <rect x="200" y="184" width="160" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/>
        <rect x="212" y="196" width="40" height="16" rx="4" fill="rgba(79,93,117,0.12)"/><text x="232" y="208" class="mono" font-size="8" text-anchor="middle" fill="#4f5d75">现场</text>
        <text x="280" y="224" font-size="16" font-weight="600" text-anchor="middle">固定摄像头</text><text x="280" y="244" class="mono" font-size="12" text-anchor="middle" fill="#4f5d75">持续发现候选事件</text>

        <rect x="200" y="280" width="160" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/>
        <rect x="212" y="292" width="40" height="16" rx="4" fill="rgba(79,93,117,0.12)"/><text x="232" y="304" class="mono" font-size="8" text-anchor="middle" fill="#4f5d75">现场</text>
        <text x="280" y="320" font-size="16" font-weight="600" text-anchor="middle">机器人移动视觉</text><text x="280" y="340" class="mono" font-size="12" text-anchor="middle" fill="#4f5d75">伴随式巡检，不额外绕路</text>

        <rect x="384" y="380" width="160" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/>
        <rect x="396" y="392" width="40" height="16" rx="4" fill="rgba(79,93,117,0.12)"/><text x="416" y="404" class="mono" font-size="8" text-anchor="middle" fill="#4f5d75">AI</text>
        <text x="464" y="420" font-size="16" font-weight="600" text-anchor="middle">AI 事件研判</text><text x="464" y="440" class="mono" font-size="12" text-anchor="middle" fill="#4f5d75">边缘筛选，必要时云端补证</text>

        <rect x="568" y="380" width="160" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/>
        <rect x="580" y="392" width="40" height="16" rx="4" fill="rgba(79,93,117,0.12)"/><text x="600" y="404" class="mono" font-size="8" text-anchor="middle" fill="#4f5d75">事实</text>
        <text x="648" y="420" font-size="16" font-weight="600" text-anchor="middle">空间定位与任务画像</text><text x="648" y="440" class="mono" font-size="12" text-anchor="middle" fill="#4f5d75">事件事实转为可执行约束</text>

        <rect x="752" y="380" width="160" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
        <rect x="764" y="392" width="40" height="16" rx="4" fill="rgba(235,108,54,0.20)"/><text x="784" y="404" class="mono" font-size="8" text-anchor="middle" fill="#eb6c36">核心</text>
        <text x="832" y="420" font-size="16" font-weight="600" text-anchor="middle">确定性调度</text><text x="832" y="440" class="mono" font-size="12" text-anchor="middle" fill="#4f5d75">能力、路线与策略共同约束</text>

        <rect x="912" y="476" width="160" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/>
        <rect x="924" y="488" width="40" height="16" rx="4" fill="rgba(79,93,117,0.12)"/><text x="944" y="500" class="mono" font-size="8" text-anchor="middle" fill="#4f5d75">处置</text>
        <text x="992" y="516" font-size="16" font-weight="600" text-anchor="middle">机器人或人工处置</text><text x="992" y="536" class="mono" font-size="12" text-anchor="middle" fill="#4f5d75">无合格机器人时安全转人工</text>

        <rect x="1104" y="476" width="112" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/>
        <rect x="1116" y="488" width="40" height="16" rx="4" fill="rgba(79,93,117,0.12)"/><text x="1136" y="500" class="mono" font-size="8" text-anchor="middle" fill="#4f5d75">验收</text>
        <text x="1160" y="516" font-size="16" font-weight="600" text-anchor="middle">证据验收</text><text x="1160" y="536" class="mono" font-size="12" text-anchor="middle" fill="#4f5d75">关闭或人工复核</text>
      </g>

      <line x1="48" y1="656" x2="1232" y2="656" stroke="rgba(45,49,66,0.20)"/>
      <text x="48" y="688" class="mono" font-size="12" letter-spacing="1" fill="#4f5d75">关键边界</text>
      <text x="208" y="688" class="sans" font-size="14" fill="#2d3142">AI 负责研判不确定性</text>
      <text x="512" y="688" class="sans" font-size="14" fill="#2d3142">调度遵循确定性约束</text>
      <text x="832" y="688" class="sans" font-size="14" fill="#2d3142">感知不等于执行；验收数据进入运营优化</text>
    </svg>
  </main>
</body>
</html>
